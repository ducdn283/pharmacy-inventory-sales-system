# ---------------------------------------------------------
# DATABASE CONFIGURATION (Sử dụng biến môi trường Railway)
# ---------------------------------------------------------
# Cú pháp ${TÊN_BIẾN:giá_trị_mặc_định_local} giúp ứng dụng chạy được cả ở Local và Server
spring.datasource.url=jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:hang_ngoc_pisms}?serverTimezone=Asia/Ho_Chi_Minh
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:123456}

# ---------------------------------------------------------
# JPA / HIBERNATE & FLYWAY
# ---------------------------------------------------------
spring.jpa.show-sql=true
spring.jpa.generate-ddl=false
# Chế độ validate yêu cầu Flyway phải tạo bảng trước
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# (Giữ nguyên các cấu hình SMTP, Cloudinary bên dưới của bạn)

spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${SMTP_FROM:}
app.auth.log-reset-link=${APP_AUTH_LOG_RESET_LINK:true}
app.auth.base-url=${APP_AUTH_BASE_URL:http://localhost:8080}

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

server.tomcat.max-swallow-size=10MB
