<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8"/>
  <title>Tạo nhà cung cấp</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="apple-touch-icon" sizes="180x180" href="./assets/images/apple-touch-icon.png" th:href="@{/assets/images/apple-touch-icon.png}">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png" th:href="@{/assets/images/favicon-32x32.png}">
  <link rel="icon" type="image/png" sizes="16x16" href="./assets/images/favicon-16x16.png" th:href="@{/assets/images/favicon-16x16.png}">
  <link rel="manifest" href="./assets/site.webmanifest" th:href="@{/assets/site.webmanifest}">
  <script type="module" crossorigin src="./assets/js/main.js" th:src="@{/assets/js/main.js}"></script>
  <link rel="stylesheet" crossorigin href="./assets/css/main.css" th:href="@{/assets/css/main.css}">

  <style>
    :root {
      --sup-green:      #059669;
      --sup-green-dark: #047857;
      --sup-border:     #e5e7eb;
      --sup-muted:      #6b7280;
    }
    body { background: #f6f7f9; }
    .sup-card {
      background: #fff; border: 1px solid var(--sup-border);
      border-radius: 14px; box-shadow: 0 1px 2px rgba(16,24,40,.04);
    }
    .form-label { font-size: 13px; color: #111827; margin-bottom: 6px; }
    .form-control {
      min-height: 40px; border-radius: 10px;
      border-color: var(--sup-border); font-size: 13px;
    }
    .form-control:focus {
      border-color: #6ee7b7;
      box-shadow: 0 0 0 3px rgba(5,150,105,.1);
    }
    .btn-sup-primary {
      background: var(--sup-green); border-color: var(--sup-green); color: #fff;
      border-radius: 10px; min-height: 42px; font-size: 13px;
      font-weight: 500; display: inline-flex; align-items: center;
      justify-content: center; gap: 6px; width: 100%;
    }
    .btn-sup-primary:hover { background: var(--sup-green-dark); border-color: var(--sup-green-dark); color: #fff; }
    .btn-cancel {
      background: transparent; border: none; color: var(--sup-muted);
      font-size: 13px; font-weight: 500; min-height: 42px; width: 100%;
      display: inline-flex; align-items: center; justify-content: center;
      gap: 6px; text-decoration: none;
    }
    .btn-cancel:hover { color: #111827; }
  </style>
</head>

<body>
<div th:replace="~{fragments/topbar :: topbar}"></div>
<aside th:replace="~{fragments/sidebar :: sidebar}"></aside>

<main id="content" class="content py-8">
  <div class="container-fluid">

    <div class="mb-4">
      <h1 class="fs-4 mb-0">Tạo nhà cung cấp mới</h1>
    </div>

    <!-- data-validate thay cho novalidate: fragment field-validation tự tắt bong bóng mặc định của
         trình duyệt rồi hiện thông báo ngay dưới ô, cùng style với lỗi do server render. Nếu JS lỗi
         thì `required`/`pattern` của trình duyệt vẫn còn chặn. -->
    <form th:action="@{/supplier/create}" th:object="${form}" method="post" data-validate id="createForm">
      <div class="row g-4">

        <!-- Form thông tin -->
        <div class="col-12">
          <div class="sup-card p-4 p-md-5">
            <h2 class="fs-6 mb-4">Thông tin nhà cung cấp</h2>

            <div th:if="${errorMessage}" class="alert alert-danger mb-4">
              <i class="ti ti-alert-circle me-2"></i>
              <span th:text="${errorMessage}"></span>
            </div>

            <div class="mb-3">
              <label for="supplierName" class="form-label">
                Tên nhà cung cấp <span class="text-danger">*</span>
              </label>
              <input id="supplierName" type="text" class="form-control"
                     th:field="*{name}"
                     th:classappend="${#fields.hasErrors('name')} ? ' is-invalid'"
                     required
                     placeholder="Nhập tên nhà cung cấp">
              <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
            </div>

            <div class="mb-3">
              <label for="supplierTaxCode" class="form-label">
                Mã số thuế <span class="text-danger">*</span>
              </label>
              <!-- MST 10 số, có thể kèm "-3 số" cho đơn vị trực thuộc → cho gõ cả dấu gạch ngang. -->
              <input id="supplierTaxCode" type="text" class="form-control"
                     th:field="*{taxCode}"
                     th:classappend="${#fields.hasErrors('taxCode')} ? ' is-invalid'"
                     inputmode="numeric" data-digits="-"
                     data-unique-url="/supplier/check-duplicate"
                     data-unique-field="taxCode"
                     data-unique-message="Mã số thuế đã được sử dụng bởi nhà cung cấp khác"
                     maxlength="20" required
                     pattern="[0-9]{10}(-[0-9]{3})?"
                     title="10 chữ số, hoặc 10 chữ số kèm 3 số chi nhánh (vd 0101234567-001)"
                     placeholder="VD: 0101234567 hoặc 0101234567-001">
              <div class="invalid-feedback" th:if="${#fields.hasErrors('taxCode')}" th:errors="*{taxCode}"></div>
            </div>

            <div class="row g-3 mb-3">
              <div class="col-12 col-md-6">
                <label for="supplierPhone" class="form-label">
                  Số điện thoại <span class="text-danger">*</span>
                </label>
                <input id="supplierPhone" type="tel" class="form-control"
                       th:field="*{phone}"
                       th:classappend="${#fields.hasErrors('phone')} ? ' is-invalid'"
                       inputmode="numeric" maxlength="10" data-digits
                       data-unique-url="/supplier/check-duplicate"
                       data-unique-field="phone"
                       data-unique-message="Số điện thoại đã được sử dụng bởi nhà cung cấp khác"
                       pattern="0(2|3|5|7|8|9)[0-9]{8}"
                       title="10 chữ số, bắt đầu bằng 02, 03, 05, 07, 08 hoặc 09"
                       required
                       placeholder="0900000000">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
              </div>
              <div class="col-12 col-md-6">
                <label for="supplierEmail" class="form-label">
                  Email <span class="text-danger">*</span>
                </label>
                <input id="supplierEmail" type="email" class="form-control"
                       th:field="*{email}"
                       th:classappend="${#fields.hasErrors('email')} ? ' is-invalid'"
                       data-unique-url="/supplier/check-duplicate"
                       data-unique-field="email"
                       data-unique-message="Email đã được sử dụng bởi nhà cung cấp khác"
                       maxlength="100"
                       pattern="[A-Za-z0-9_-]+(\.[A-Za-z0-9_-]+)*@[A-Za-z0-9-]+(\.[A-Za-z0-9-]+)*\.[A-Za-z]{2,}"
                       title="Chỉ gồm chữ, số, '.', '-', '_' và phải có đuôi hợp lệ (ví dụ .com, .vn)"
                       required
                       placeholder="supplier@example.com">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
              </div>
            </div>

            <div class="mb-0">
              <label for="supplierAddress" class="form-label">
                Địa chỉ <span class="text-danger">*</span>
              </label>
              <textarea id="supplierAddress" class="form-control"
                        th:field="*{address}"
                        th:classappend="${#fields.hasErrors('address')} ? ' is-invalid'"
                        rows="3" required
                        placeholder="Nhập địa chỉ nhà cung cấp"></textarea>
              <div class="invalid-feedback" th:if="${#fields.hasErrors('address')}" th:errors="*{address}"></div>
            </div>

            <!-- Ghi chú -->
            <div class="alert alert-info small p-3 mt-4 mb-4">
              <i class="ti ti-info-circle me-1"></i>
              Sau khi tạo nhà cung cấp, có thể thêm sản phẩm cung ứng tại trang chi tiết của nhà cung cấp.
            </div>

            <!-- Nút thao tác -->
            <div class="d-flex flex-wrap gap-2">
              <button type="submit" name="action" value="create" class="btn btn-sup-primary w-auto px-4">
                <i class="ti ti-check"></i>Tạo nhà cung cấp
              </button>
              <a th:href="@{/supplier}" class="btn-cancel w-auto px-4">
                <i class="ti ti-arrow-left"></i>Quay lại danh sách
              </a>
            </div>
          </div>
        </div>

      </div>
    </form>

  </div>
</main>

<!-- Chặn ngay lúc gõ cho 2 ô data-digits: mã số thuế (cho cả dấu gạch) và số điện thoại. -->
<div th:replace="~{fragments/number-input :: numberInputs}"></div>

<!-- Báo trùng MST / SĐT / email ngay lúc rời ô. Chặn thật vẫn là SupplierService.validateUnique (và
     UNIQUE index ở DB cho ca hai người nhập cùng lúc) — đây chỉ là lớp báo sớm. -->
<div th:replace="~{fragments/unique-check :: uniqueChecks}"></div>

<!-- Ô bắt buộc để trống / sai định dạng: báo ngay dưới ô, không dùng bong bóng của trình duyệt. -->
<div th:replace="~{fragments/field-validation :: fieldValidation}"></div>
<div th:replace="~{fragments/single-submit :: singleSubmit}"></div>
</body>
</html>
