<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8" />
  <title>Không có quyền truy cập | Nhà thuốc Hằng Ngọc</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="apple-touch-icon" sizes="180x180" href="./assets/images/apple-touch-icon.png" th:href="@{/assets/images/apple-touch-icon.png}">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png" th:href="@{/assets/images/favicon-32x32.png}">
  <link rel="icon" type="image/png" sizes="16x16" href="./assets/images/favicon-16x16.png" th:href="@{/assets/images/favicon-16x16.png}">
  <link rel="manifest" href="./assets/site.webmanifest" th:href="@{/assets/site.webmanifest}">

  <script type="module" crossorigin src="./assets/js/main.js" th:src="@{/assets/js/main.js}"></script>
  <link rel="stylesheet" crossorigin href="./assets/css/main.css" th:href="@{/assets/css/main.css}">

  <th:block th:replace="~{fragments/error-page :: errorStyles}"></th:block>
</head>

<body>
<!--
  Màn từ chối quyền, do SecurityConfig.accessDeniedPage("/403") trỏ tới khi người đã đăng nhập mở một
  đường dẫn thuộc vai trò khác. Dùng chung fragment với trang lỗi tổng để hai màn không lệch giao diện.

  Không hiện đường dẫn bị chặn: người dùng đã biết mình vừa mở gì, mà in ra thì thành gợi ý những URL
  nội bộ đang tồn tại.
-->
<th:block th:replace="~{fragments/error-page :: errorBody(403, null)}"></th:block>

</body>

</html>
