<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<body>
<!--
  Reusable topbar (+ mobile overlay). Keeps the original markup and the element IDs
  (overlay, topbar, toggleBtn, mobileBtn) that the bundled main.js relies on.
  The user dropdown shows the signed-in user (currentAccountName / currentRoleDisplay from the
  model, populated by SidebarInterceptor from Spring Security) and holds Hồ sơ cá nhân,
  Đổi mật khẩu and Đăng xuất.
  Usage in a page: <div th:replace="~{fragments/topbar :: topbar}"></div>
-->
<th:block th:fragment="topbar">
    <div id="overlay" class="overlay"></div>
    <!-- TOPBAR -->
    <nav id="topbar" class="navbar bg-white border-bottom fixed-top topbar pm-topbar px-3">
        <div class="pm-topbar-inner">
            <div class="pm-topbar-left">
                <button id="mobileBtn"
                        class="btn btn-light btn-icon btn-sm d-lg-none me-2"
                        type="button"
                        aria-label="Mở menu">
                    <i class="ti ti-menu-2"></i>
                </button>

                <h1 class="pm-topbar-title mb-0"
                    th:text="${pageTitle != null ? pageTitle : (currentPageTitle != null ? currentPageTitle : 'Tổng quan')}">
                    Tổng quan
                </h1>
            </div>

            <div class="pm-topbar-actions">

                <a th:if="${currentSellingUrl != null}"
                   class="pm-topbar-icon-btn pm-selling-btn"
                   th:href="${currentSellingUrl}"
                   href="#"
                   role="button"
                   aria-label="Bán hàng"
                   title="Bán hàng">
                    <i class="ti ti-shopping-cart"></i>
                    <span class="pm-selling-btn-label">Bán hàng</span>
                </a>

                <div class="dropdown">
                    <a class="position-relative pm-topbar-icon-btn"
                       data-bs-toggle="dropdown"
                       aria-expanded="false"
                       href="#"
                       role="button"
                       aria-label="Thông báo">

                        <i class="ti ti-bell"></i>

                        <span id="notificationDot"
                              th:if="${unreadNotificationCount != null
                       and unreadNotificationCount > 0}"
                              class="pm-notification-dot"
                              aria-hidden="true">
        </span>
                    </a>

                    <div class="dropdown-menu dropdown-menu-end
                dropdown-menu-md p-0 pm-notification-menu">

                        <ul class="list-unstyled p-0 m-0">

                            <li class="px-3 py-3 border-bottom
                       d-flex justify-content-between
                       align-items-center">

                <span class="fw-semibold small">
                    Thông báo mới
                </span>

                                <span id="notificationCountBadge"
                                      class="badge bg-success"
                                      th:if="${unreadNotificationCount != null
                               and unreadNotificationCount > 0}"
                                      th:text="${unreadNotificationCount}">
                    0
                </span>
                            </li>

                            <li id="notificationEmptyState"
                                th:if="${latestNotifications == null
                         or #lists.isEmpty(latestNotifications)}"
                                class="p-3 border-bottom">

                                <div class="small text-secondary">
                                    Hiện chưa có thông báo.
                                </div>
                            </li>

                            <li th:each="item : ${latestNotifications}"
                                class="p-3 border-bottom
                       realtime-notification-item">

                                <div class="small">
                                    <p class="mb-1 fw-semibold"
                                       th:text="${item.title}">
                                        Tiêu đề thông báo
                                    </p>

                                    <p class="mb-1 text-secondary"
                                       th:text="${item.message}">
                                        Nội dung thông báo
                                    </p>

                                    <span class="text-secondary"
                                          th:text="${item.createdAtDisplay}">
                        28/07/2026 22:00
                    </span>
                                </div>
                            </li>

                            <li id="notificationViewAll"
                                class="px-4 py-3 text-center">

                                <a th:href="${currentNotificationsUrl != null
                              ? currentNotificationsUrl
                              : '#'}"
                                   href="#"
                                   class="pm-menu-link">

                                    Xem tất cả thông báo
                                </a>
                            </li>
                        </ul>
                    </div>
                </div>

                <div class="vr d-none d-md-block pm-topbar-divider"></div>

                <div class="dropdown">
                    <a href="#"
                       class="pm-topbar-user"
                       role="button"
                       data-bs-toggle="dropdown"
                       aria-expanded="false">
          <span class="pm-topbar-avatar"
                th:text="${currentUserInitials != null ? currentUserInitials : 'U'}">
            U
          </span>

                        <span class="pm-topbar-user-text d-none d-md-block">
            <span class="pm-topbar-user-name"
                  th:text="${currentAccountName != null ? currentAccountName : 'Người dùng'}">
              Người dùng
            </span>
            <span class="pm-topbar-user-role"
                  th:text="${currentRoleDisplay != null ? currentRoleDisplay : 'Vai trò'}">
              Vai trò
            </span>
          </span>
                    </a>

                    <div class="dropdown-menu dropdown-menu-end p-0 pm-user-menu">
                        <div class="d-flex gap-3 align-items-center border-bottom px-3 py-3">
            <span class="pm-topbar-avatar pm-topbar-avatar-lg"
                  th:text="${currentUserInitials != null ? currentUserInitials : 'U'}">
              U
            </span>

                            <div>
                                <h4 class="mb-0 small"
                                    th:text="${currentAccountName != null ? currentAccountName : 'Người dùng'}">
                                    Người dùng
                                </h4>
                                <span class="pm-role-badge mt-1"
                                      th:text="${currentRoleDisplay != null ? currentRoleDisplay : 'Vai trò'}">
                Vai trò
              </span>
                            </div>
                        </div>

                        <div class="p-3 d-flex flex-column gap-1 small lh-lg">
                            <a th:href="@{/profile}" href="#!">
                                <i class="ti ti-user me-1"></i>
                                <span>Hồ sơ cá nhân</span>
                            </a>

                            <a th:href="@{/profile(section='password')}" href="#!">
                                <i class="ti ti-key me-1"></i>
                                <span>Đổi mật khẩu</span>
                            </a>
                        </div>

                        <div class="border-top px-3 py-3">
                            <form th:action="@{/logout-guard}" method="post" class="m-0">
                                <input type="hidden"
                                       th:if="${_csrf}"
                                       th:name="${_csrf.parameterName}"
                                       th:value="${_csrf.token}">
                                <button type="submit" class="btn btn-sm btn-outline-secondary w-100">
                                    <i class="ti ti-logout me-1"></i>
                                    Đăng xuất
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <style>
        .pm-topbar {
            height: 60px;
            margin-left: 240px;
            z-index: 1020;
            font-family: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
        }

        .pm-topbar-inner {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            min-width: 0;
        }

        .pm-topbar-left,
        .pm-topbar-actions,
        .pm-topbar-user {
            display: flex;
            align-items: center;
        }

        .pm-topbar-left {
            min-width: 0;
            flex: 1 1 auto;
        }

        .pm-topbar-title {
            color: #111827;
            font-size: 16px;
            font-weight: 600;
            line-height: 1.25;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .pm-topbar-actions {
            flex: 0 0 auto;
            justify-content: flex-end;
            gap: 16px;
        }

        .pm-topbar-icon-btn {
            width: 34px;
            height: 34px;
            border-radius: 999px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #374151;
            text-decoration: none;
            background: #ffffff;
            border: 1px solid transparent;
            transition: background-color .16s ease, border-color .16s ease, color .16s ease;
        }

        .pm-topbar-icon-btn:hover,
        .pm-topbar-icon-btn:focus {
            background: #f3f4f6;
            border-color: #e5e7eb;
            color: #059669;
        }

        .pm-topbar-icon-btn i {
            font-size: 18px;
            line-height: 1;
        }

        .pm-selling-btn {
            width: auto;
            height: 38px;
            gap: 7px;
            padding: 0 14px;
            border-color: #059669;
            border-radius: 10px;
            background: #059669;
            color: #ffffff;
            font-size: 13px;
            font-weight: 700;
            white-space: nowrap;
            box-shadow: 0 3px 10px rgba(5, 150, 105, .22);
        }

        .pm-selling-btn:hover,
        .pm-selling-btn:focus-visible {
            border-color: #047857;
            background: #047857;
            color: #ffffff;
            box-shadow: 0 5px 14px rgba(5, 150, 105, .3);
            transform: translateY(-1px);
        }

        .pm-selling-btn:active {
            background: #065f46;
            border-color: #065f46;
            box-shadow: none;
            transform: translateY(0);
        }

        .pm-selling-btn-label {
            line-height: 1;
        }

        .pm-notification-dot {
            position: absolute;
            top: 7px;
            right: 7px;
            width: 7px;
            height: 7px;
            border-radius: 999px;
            background: #dc2626;
            border: 1.5px solid #ffffff;
        }

        .pm-topbar-divider {
            height: 24px;
            opacity: .5;
            /* Bootstrap's .vr sets align-self:stretch; with an explicit height that no longer
               stretches the element, so it keeps the flex-start (top) fallback instead of
               following .pm-topbar-actions' align-items:center like its siblings. Force it back
               to center so the line sits level with the icon/avatar next to it. */
            align-self: center;
        }

        .pm-topbar-user {
            gap: 10px;
            color: #111827;
            text-decoration: none;
        }

        .pm-topbar-avatar {
            width: 30px;
            height: 30px;
            border-radius: 999px;
            background: #dff3ec;
            color: #059669;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 700;
            line-height: 1;
            text-transform: uppercase;
            letter-spacing: .01em;
            flex: 0 0 auto;
        }

        .pm-topbar-avatar-lg {
            width: 40px;
            height: 40px;
            font-size: 13px;
        }

        .pm-topbar-user-text {
            min-width: 112px;
        }

        .pm-topbar-user-name,
        .pm-topbar-user-role {
            display: block;
            max-width: 150px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .pm-topbar-user-name {
            font-size: 12px;
            font-weight: 600;
            color: #111827;
            line-height: 1.2;
        }

        .pm-topbar-user-role {
            margin-top: 2px;
            font-size: 11px;
            color: #6b7280;
            line-height: 1.2;
        }

        .pm-notification-menu {
            min-width: 320px;
        }

        .pm-user-menu {
            min-width: 240px;
        }

        .pm-user-menu,
        .pm-notification-menu {
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            box-shadow: 0 14px 34px rgba(15, 23, 42, .12);
            overflow: hidden;
        }

        .pm-role-badge {
            display: inline-flex;
            align-items: center;
            width: fit-content;
            padding: 4px 10px;
            border-radius: 999px;
            background: #dff3ec;
            color: #059669;
            font-size: 11px;
            font-weight: 600;
            line-height: 1.2;
        }

        .pm-user-menu a,
        .pm-notification-menu a,
        .pm-menu-link {
            color: #059669 !important;
            text-decoration: none;
            font-weight: 500;
        }

        .pm-user-menu a:hover,
        .pm-notification-menu a:hover,
        .pm-menu-link:hover {
            color: #047857 !important;
            background: #e8f7f1;
        }

        .pm-user-menu .btn-outline-secondary {
            border-color: #059669;
            color: #059669;
            border-radius: 8px;
            font-weight: 500;
        }

        .pm-user-menu .btn-outline-secondary:hover,
        .pm-user-menu .btn-outline-secondary:focus {
            background: #059669;
            border-color: #059669;
            color: #ffffff;
        }

        @media (max-width: 991.98px) {
            .pm-topbar {
                margin-left: 0 !important;
                width: 100% !important;
            }
        }

        @media (max-width: 767.98px) {
            .pm-topbar-actions {
                gap: 10px;
            }

            .pm-selling-btn {
                height: 36px;
                padding: 0 11px;
            }
        }
    </style>

    <script th:inline="none">
        (function () {
            var SUMMARY_URL =
                '/notifications/realtime/summary';

            var STREAM_URL =
                '/notifications/realtime/stream';

            /**
             * Chuyển giá trị null thành chuỗi rỗng.
             */
            function safeText(value) {
                return value == null
                    ? ''
                    : String(value);
            }

            /**
             * Lấy số notification chưa đọc và danh sách
             * notification mới nhất.
             */
            function refreshNotificationTopbar() {
                fetch(
                    SUMMARY_URL,
                    {
                        headers: {
                            'Accept': 'application/json'
                        },
                        credentials: 'same-origin'
                    }
                )
                    .then(function (response) {
                        if (!response.ok) {
                            throw new Error(
                                'Không thể tải thông báo'
                            );
                        }

                        return response.json();
                    })
                    .then(renderNotificationTopbar)
                    .catch(function () {
                        /*
                         * Bỏ qua lỗi mạng tạm thời.
                         * SSE sẽ gửi sự kiện lại khi có thay đổi tiếp theo.
                         */
                    });
            }

            /**
             * Cập nhật badge và dropdown notification.
             */
            function renderNotificationTopbar(data) {
                var count = Number(
                    data && data.unreadCount
                        ? data.unreadCount
                        : 0
                );

                var bell = document.querySelector(
                    '[aria-label="Thông báo"]'
                );

                var dot = document.getElementById(
                    'notificationDot'
                );

                var badge = document.getElementById(
                    'notificationCountBadge'
                );

                /*
                 * Cập nhật chấm báo và số chưa đọc.
                 */
                if (count > 0) {
                    if (!dot && bell) {
                        dot = document.createElement(
                            'span'
                        );

                        dot.id = 'notificationDot';
                        dot.className =
                            'pm-notification-dot';

                        dot.setAttribute(
                            'aria-hidden',
                            'true'
                        );

                        bell.appendChild(dot);
                    }

                    if (!badge) {
                        badge = document.createElement(
                            'span'
                        );

                        badge.id =
                            'notificationCountBadge';

                        badge.className =
                            'badge bg-success';

                        var header =
                            document.querySelector(
                                '.pm-notification-menu '
                                + 'li:first-child'
                            );

                        if (header) {
                            header.appendChild(badge);
                        }
                    }

                    if (badge) {
                        badge.textContent =
                            String(count);
                    }
                } else {
                    if (dot) {
                        dot.remove();
                    }

                    if (badge) {
                        badge.remove();
                    }
                }

                /*
                 * Xóa các notification cũ khỏi dropdown.
                 */
                document
                    .querySelectorAll(
                        '.realtime-notification-item'
                    )
                    .forEach(function (item) {
                        item.remove();
                    });

                var oldEmpty =
                    document.getElementById(
                        'notificationEmptyState'
                    );

                if (oldEmpty) {
                    oldEmpty.remove();
                }

                var viewAll =
                    document.getElementById(
                        'notificationViewAll'
                    );

                var list = viewAll
                    ? viewAll.parentElement
                    : null;

                var notifications =
                    data
                    && Array.isArray(
                        data.latestNotifications
                    )
                        ? data.latestNotifications
                        : [];

                if (!list || !viewAll) {
                    return;
                }

                /*
                 * Trạng thái không có notification.
                 */
                if (notifications.length === 0) {
                    var empty =
                        document.createElement('li');

                    empty.id =
                        'notificationEmptyState';

                    empty.className =
                        'p-3 border-bottom';

                    var emptyText =
                        document.createElement('div');

                    emptyText.className =
                        'small text-secondary';

                    emptyText.textContent =
                        'Hiện chưa có thông báo.';

                    empty.appendChild(emptyText);

                    list.insertBefore(
                        empty,
                        viewAll
                    );

                    return;
                }

                /*
                 * Dùng textContent thay vì innerHTML để tránh
                 * đưa nội dung notification trực tiếp thành HTML.
                 */
                notifications.forEach(
                    function (notification) {
                        var item =
                            document.createElement('li');

                        item.className =
                            'p-3 border-bottom '
                            + 'realtime-notification-item';

                        var content =
                            document.createElement('div');

                        content.className = 'small';

                        var title =
                            document.createElement('p');

                        title.className =
                            'mb-1 fw-semibold';

                        title.textContent =
                            safeText(
                                notification.title
                            );

                        var message =
                            document.createElement('p');

                        message.className =
                            'mb-1 text-secondary';

                        message.textContent =
                            safeText(
                                notification.message
                            );

                        var createdAt =
                            document.createElement('span');

                        createdAt.className =
                            'text-secondary';

                        createdAt.textContent =
                            safeText(
                                notification
                                    .createdAtDisplay
                            );

                        content.appendChild(title);
                        content.appendChild(message);
                        content.appendChild(createdAt);

                        item.appendChild(content);

                        list.insertBefore(
                            item,
                            viewAll
                        );
                    }
                );
            }

            /**
             * Mở kết nối SSE.
             *
             * EventSource tự kết nối lại nếu kết nối bị timeout
             * hoặc mất mạng tạm thời.
             *
             * ĐÓNG LẠI KHI TAB BỊ ẨN — xem khối "kiểm tra phiên"
             * bên dưới để biết lý do. SseEmitter đặt timeout đúng
             * 30 phút, bằng luôn thời hạn phiên: mỗi lần nó tự kết
             * nối lại là một request mới làm mới phiên ngay tại
             * thời điểm phiên đáng lẽ hết hạn, nên chỉ cần một tab
             * bỏ quên là tài khoản không bao giờ được nhả ra.
             */
            var notificationStream = null;

            function openNotificationStream() {
                if (!window.EventSource
                    || notificationStream) {
                    return;
                }

                notificationStream =
                    new EventSource(STREAM_URL);

                notificationStream
                    .addEventListener(
                        'notification-refresh',
                        refreshNotificationTopbar
                    );
            }

            function closeNotificationStream() {
                if (!notificationStream) {
                    return;
                }

                notificationStream.close();
                notificationStream = null;
            }

            openNotificationStream();

            window.addEventListener(
                'beforeunload',
                closeNotificationStream
            );

            document.addEventListener(
                'visibilitychange',
                function () {
                    if (document.visibilityState
                        === 'visible') {
                        openNotificationStream();

                        /*
                         * Nạp lại một lần để bù phần thông báo
                         * phát sinh trong lúc tab bị ẩn.
                         */
                        refreshNotificationTopbar();
                    } else {
                        closeNotificationStream();
                    }
                }
            );

            /*
             * Logic kiểm tra phiên đăng nhập hiện tại.
             */
            var POLL_MS = 30000;

            setInterval(
                function () {
                    /*
                     * CHỈ hỏi khi tab đang hiển thị.
                     *
                     * Mọi request đều làm mới lastAccessedTime của
                     * HttpSession, nên vòng lặp 30 giây này giữ
                     * phiên sống VĨNH VIỄN — luật "30 phút không
                     * thao tác thì hết phiên" (F-01) không bao giờ
                     * có cơ hội chạy khi còn một tab bỏ quên ở đâu
                     * đó. Cộng với maximumSessions(1) +
                     * maxSessionsPreventsLogin(true) (F-02), người
                     * dùng quên đăng xuất sẽ bị chặn ở mọi lần đăng
                     * nhập sau, mà SessionRegistry nằm trong RAM
                     * nên chỉ restart app mới gỡ được.
                     *
                     * Tab bị ẩn = người dùng không thao tác thật,
                     * đúng nghĩa "không hoạt động" của F-01.
                     */
                    if (document.visibilityState !== 'visible') {
                        return;
                    }

                    fetch('/api/session/check')
                        .then(function (res) {
                            /*
                             * Đi theo đích server điều hướng:
                             *
                             * /signin?roleChanged:
                             * Vai trò hoặc quyền đã bị đổi.
                             *
                             * /signin:
                             * Phiên đăng nhập đã hết hạn.
                             */
                            if (res.redirected) {
                                window.location.replace(
                                    res.url
                                );
                            } else if (
                                res.status === 401
                                || res.status === 403
                            ) {
                                window.location.replace(
                                    '/signin'
                                );
                            }
                        })
                        .catch(function () {
                            /*
                             * Bỏ qua lỗi mạng tạm thời.
                             */
                        });
                },
                POLL_MS
            );
        })();
    </script>

</th:block>
</body>

</html>
