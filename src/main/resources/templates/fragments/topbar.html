<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<body>
<!--
  Reusable topbar (+ mobile overlay). Keeps the original markup and the element IDs
  (overlay, topbar, toggleBtn, mobileBtn) that the bundled main.js relies on.
  The user dropdown shows the signed-in user (currentAccountName / currentRoleDisplay from the
  model, populated by SidebarInterceptor from Spring Security) and holds Hồ sơ cá nhân,
  Đổi mật khẩu and Đăng xuất.
  Usage in a page: <div th:replace="~{fragments/topbar :: topbar}"></div>
-->
<th:block th:fragment="topbar">
    <div id="overlay" class="overlay"></div>

    <nav id="topbar"
         class="navbar bg-white border-bottom fixed-top topbar pm-topbar px-3"
         th:data-notifications-base="${currentNotificationsUrl != null ? currentNotificationsUrl : ''}"
         th:data-csrf-header="${_csrf != null ? _csrf.headerName : ''}"
         th:data-csrf-token="${_csrf != null ? _csrf.token : ''}">

        <div class="pm-topbar-inner">
            <div class="pm-topbar-left">
                <button id="mobileBtn"
                        class="btn btn-light btn-icon btn-sm d-lg-none me-2"
                        type="button"
                        aria-label="Mở menu">
                    <i class="ti ti-menu-2"></i>
                </button>

                <h1 class="pm-topbar-title mb-0"
                    th:text="${pageTitle != null
                        ? pageTitle
                        : (currentPageTitle != null
                            ? currentPageTitle
                            : 'Tổng quan')}">
                    Tổng quan
                </h1>
            </div>

            <div class="pm-topbar-actions">
                <a th:if="${currentSellingUrl != null}"
                   class="pm-topbar-icon-btn pm-selling-btn"
                   th:href="${currentSellingUrl}"
                   href="#"
                   role="button"
                   aria-label="Bán hàng"
                   title="Bán hàng">

                    <i class="ti ti-shopping-cart"></i>

                    <span class="pm-selling-btn-label">
                        Bán hàng
                    </span>
                </a>

                <!-- Khu vực thông báo -->
                <div class="dropdown">
                    <a class="position-relative pm-topbar-icon-btn"
                       data-bs-toggle="dropdown"
                       aria-expanded="false"
                       href="#"
                       role="button"
                       aria-label="Thông báo">

                        <i class="ti ti-bell"></i>

                        <span id="notificationDot"
                              th:if="${unreadNotificationCount != null
                                  and unreadNotificationCount > 0}"
                              class="pm-notification-dot"
                              aria-hidden="true">
                        </span>
                    </a>

                    <div class="dropdown-menu dropdown-menu-end
                                dropdown-menu-md p-0
                                pm-notification-menu">

                        <ul class="list-unstyled p-0 m-0">
                            <li class="border-bottom">
                                <a th:href="${currentNotificationsUrl != null
            ? currentNotificationsUrl
            : '#'}"
                                   href="#"
                                   class="pm-notification-header-link
              px-3 py-3">

        <span class="fw-semibold small">
            Thông báo mới
        </span>

                                    <span id="notificationCountBadge"
                                          class="badge bg-success"
                                          th:if="${unreadNotificationCount != null
                  and unreadNotificationCount > 0}"
                                          th:text="${unreadNotificationCount}">
            0
        </span>
                                </a>
                            </li>

                            <li id="notificationEmptyState"
                                th:if="${latestNotifications == null
                                    or #lists.isEmpty(latestNotifications)}"
                                class="p-3 border-bottom">

                                <div class="small text-secondary">
                                    Hiện chưa có thông báo.
                                </div>
                            </li>

                            <li th:each="item : ${latestNotifications}"
                                class="p-3 border-bottom
                                       realtime-notification-item
                                       pm-notification-clickable"
                                role="button"
                                tabindex="0"
                                th:data-notification-id="${item.id}"
                                th:data-action-url="${item.actionUrl}">

                                <div class="small">
                                    <p class="mb-1 fw-semibold"
                                       th:text="${item.title}">
                                        Tiêu đề thông báo
                                    </p>

                                    <p class="mb-1 text-secondary"
                                       th:text="${item.message}">
                                        Nội dung thông báo
                                    </p>

                                    <span class="text-secondary"
                                          th:text="${item.createdAtDisplay}">
                                        28/07/2026 22:00
                                    </span>
                                </div>
                            </li>

                            <li id="notificationViewAll"
                                class="px-4 py-3 text-center">

                                <a th:href="${currentNotificationsUrl != null
                                    ? currentNotificationsUrl
                                    : '#'}"
                                   href="#"
                                   class="pm-menu-link">
                                    Xem tất cả thông báo
                                </a>
                            </li>
                        </ul>
                    </div>
                </div>

                <div class="vr d-none d-md-block pm-topbar-divider"></div>

                <!-- Khu vực tài khoản -->
                <div class="dropdown">
                    <a href="#"
                       class="pm-topbar-user"
                       role="button"
                       data-bs-toggle="dropdown"
                       aria-expanded="false">

                        <span class="pm-topbar-avatar"
                              th:text="${currentUserInitials != null
                                  ? currentUserInitials
                                  : 'U'}">
                            U
                        </span>

                        <span class="pm-topbar-user-text d-none d-md-block">
                            <span class="pm-topbar-user-name"
                                  th:text="${currentAccountName != null
                                      ? currentAccountName
                                      : 'Người dùng'}">
                                Người dùng
                            </span>

                            <span class="pm-topbar-user-role"
                                  th:text="${currentRoleDisplay != null
                                      ? currentRoleDisplay
                                      : 'Vai trò'}">
                                Vai trò
                            </span>
                        </span>
                    </a>

                    <div class="dropdown-menu dropdown-menu-end
                                p-0 pm-user-menu">

                        <div class="d-flex gap-3 align-items-center
                                    border-bottom px-3 py-3">

                            <span class="pm-topbar-avatar
                                         pm-topbar-avatar-lg"
                                  th:text="${currentUserInitials != null
                                      ? currentUserInitials
                                      : 'U'}">
                                U
                            </span>

                            <div>
                                <h4 class="mb-0 small"
                                    th:text="${currentAccountName != null
                                        ? currentAccountName
                                        : 'Người dùng'}">
                                    Người dùng
                                </h4>

                                <span class="pm-role-badge mt-1"
                                      th:text="${currentRoleDisplay != null
                                          ? currentRoleDisplay
                                          : 'Vai trò'}">
                                    Vai trò
                                </span>
                            </div>
                        </div>

                        <div class="p-3 d-flex flex-column gap-1
                                    small lh-lg">

                            <a th:href="@{/profile}" href="#!">
                                <i class="ti ti-user me-1"></i>
                                <span>Hồ sơ cá nhân</span>
                            </a>

                            <a th:href="@{/profile(section='password')}"
                               href="#!">
                                <i class="ti ti-key me-1"></i>
                                <span>Đổi mật khẩu</span>
                            </a>
                        </div>

                        <div class="border-top px-3 py-3">
                            <form th:action="@{/logout-guard}"
                                  method="post"
                                  class="m-0">

                                <input type="hidden"
                                       th:if="${_csrf}"
                                       th:name="${_csrf.parameterName}"
                                       th:value="${_csrf.token}">

                                <button type="submit"
                                        class="btn btn-sm
                                               btn-outline-secondary
                                               w-100">

                                    <i class="ti ti-logout me-1"></i>
                                    Đăng xuất
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Nơi chứa popup thông báo realtime -->
    <div id="notificationToastContainer"
         class="pm-notification-toast-container"
         aria-live="polite"
         aria-atomic="false">
    </div>

    <style>
        .pm-topbar {
            height: 60px;
            margin-left: 240px;
            z-index: 1020;
            font-family: "Plus Jakarta Sans",
            system-ui,
            -apple-system,
            "Segoe UI",
            sans-serif;
        }

        .pm-topbar-inner {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            min-width: 0;
        }

        .pm-topbar-left,
        .pm-topbar-actions,
        .pm-topbar-user {
            display: flex;
            align-items: center;
        }

        .pm-topbar-left {
            min-width: 0;
            flex: 1 1 auto;
        }

        .pm-topbar-title {
            color: #111827;
            font-size: 16px;
            font-weight: 600;
            line-height: 1.25;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .pm-topbar-actions {
            flex: 0 0 auto;
            justify-content: flex-end;
            gap: 16px;
        }

        .pm-topbar-icon-btn {
            width: 34px;
            height: 34px;
            border-radius: 999px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #374151;
            text-decoration: none;
            background: #ffffff;
            border: 1px solid transparent;
            transition:
                    background-color .16s ease,
                    border-color .16s ease,
                    color .16s ease;
        }

        .pm-topbar-icon-btn:hover,
        .pm-topbar-icon-btn:focus {
            background: #f3f4f6;
            border-color: #e5e7eb;
            color: #059669;
        }

        .pm-topbar-icon-btn i {
            font-size: 18px;
            line-height: 1;
        }

        .pm-selling-btn {
            width: auto;
            height: 38px;
            gap: 7px;
            padding: 0 14px;
            border-color: #059669;
            border-radius: 10px;
            background: #059669;
            color: #ffffff;
            font-size: 13px;
            font-weight: 700;
            white-space: nowrap;
            box-shadow:
                    0 3px 10px rgba(5, 150, 105, .22);
        }

        .pm-selling-btn:hover,
        .pm-selling-btn:focus-visible {
            border-color: #047857;
            background: #047857;
            color: #ffffff;
            box-shadow:
                    0 5px 14px rgba(5, 150, 105, .3);
            transform: translateY(-1px);
        }

        .pm-selling-btn:active {
            background: #065f46;
            border-color: #065f46;
            box-shadow: none;
            transform: translateY(0);
        }

        .pm-selling-btn-label {
            line-height: 1;
        }

        .pm-notification-dot {
            position: absolute;
            top: 7px;
            right: 7px;
            width: 7px;
            height: 7px;
            border-radius: 999px;
            background: #dc2626;
            border: 1.5px solid #ffffff;
        }

        .pm-topbar-divider {
            height: 24px;
            opacity: .5;
            align-self: center;
        }

        .pm-topbar-user {
            gap: 10px;
            color: #111827;
            text-decoration: none;
        }

        .pm-topbar-avatar {
            width: 30px;
            height: 30px;
            border-radius: 999px;
            background: #dff3ec;
            color: #059669;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 700;
            line-height: 1;
            text-transform: uppercase;
            letter-spacing: .01em;
            flex: 0 0 auto;
        }

        .pm-topbar-avatar-lg {
            width: 40px;
            height: 40px;
            font-size: 13px;
        }

        .pm-topbar-user-text {
            min-width: 112px;
        }

        .pm-topbar-user-name,
        .pm-topbar-user-role {
            display: block;
            max-width: 150px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .pm-topbar-user-name {
            font-size: 12px;
            font-weight: 600;
            color: #111827;
            line-height: 1.2;
        }

        .pm-topbar-user-role {
            margin-top: 2px;
            font-size: 11px;
            color: #6b7280;
            line-height: 1.2;
        }

        .pm-notification-menu {
            min-width: 320px;
        }

        .pm-notification-header-link {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            color: #111827 !important;
            text-decoration: none;
            cursor: pointer;
            transition: background-color .16s ease;
        }

        .pm-notification-header-link:hover,
        .pm-notification-header-link:focus-visible {
            color: #111827 !important;
            background: #ecfdf5;
            outline: none;
        }

        .pm-notification-clickable {
            cursor: pointer;
            transition: background-color .16s ease;
        }

        .pm-notification-clickable:hover,
        .pm-notification-clickable:focus-visible {
            background: #ecfdf5;
            outline: none;
        }

        .pm-notification-toast-container {
            position: fixed;
            top: 76px;
            right: 20px;
            z-index: 1090;
            width: min(380px, calc(100vw - 32px));
            display: flex;
            flex-direction: column;
            gap: 12px;
            pointer-events: none;
        }

        .pm-notification-toast {
            position: relative;
            overflow: hidden;
            border: 1px solid #bbf7d0;
            border-left: 4px solid #059669;
            border-radius: 14px;
            background: #ffffff;
            box-shadow:
                    0 16px 38px rgba(15, 23, 42, .18);
            opacity: 0;
            transform: translateX(28px);
            transition:
                    opacity .2s ease,
                    transform .2s ease;
            pointer-events: auto;
        }

        .pm-notification-toast.show {
            opacity: 1;
            transform: translateX(0);
        }
        .pm-notification-toast-content {
            display: flex;
            gap: 12px;
            padding: 14px 14px 12px;
        }

        .pm-notification-toast-icon {
            width: 36px;
            height: 36px;
            flex: 0 0 36px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 11px;
            background: #dcfce7;
            color: #059669;
            font-size: 19px;
        }

        .pm-notification-toast-body {
            min-width: 0;
            flex: 1;
        }

        .pm-notification-toast-title {
            margin: 0 28px 4px 0;
            color: #111827;
            font-size: 13px;
            font-weight: 700;
        }

        .pm-notification-toast-message {
            margin: 0;
            color: #6b7280;
            font-size: 12px;
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .pm-notification-toast-close {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 26px;
            height: 26px;
            border: 0;
            border-radius: 8px;
            background: transparent;
            color: #6b7280;
        }

        .pm-notification-toast-close:hover {
            background: #f3f4f6;
            color: #111827;
        }

        .pm-notification-toast-actions {
            display: flex;
            justify-content: flex-end;
            padding: 0 14px 12px;
        }

        .pm-notification-toast-open {
            border: 0;
            background: transparent;
            color: #059669;
            font-size: 12px;
            font-weight: 700;
        }

        .pm-user-menu {
            min-width: 240px;
        }

        .pm-user-menu,
        .pm-notification-menu {
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            box-shadow:
                    0 14px 34px rgba(15, 23, 42, .12);
            overflow: hidden;
        }

        .pm-role-badge {
            display: inline-flex;
            align-items: center;
            width: fit-content;
            padding: 4px 10px;
            border-radius: 999px;
            background: #dff3ec;
            color: #059669;
            font-size: 11px;
            font-weight: 600;
            line-height: 1.2;
        }

        .pm-user-menu a,
        .pm-notification-menu a,
        .pm-menu-link {
            color: #059669 !important;
            text-decoration: none;
            font-weight: 500;
        }

        .pm-user-menu a:hover,
        .pm-notification-menu a:hover,
        .pm-menu-link:hover {
            color: #047857 !important;
            background: #e8f7f1;
        }

        .pm-user-menu .btn-outline-secondary {
            border-color: #059669;
            color: #059669;
            border-radius: 8px;
            font-weight: 500;
        }

        .pm-user-menu .btn-outline-secondary:hover,
        .pm-user-menu .btn-outline-secondary:focus {
            background: #059669;
            border-color: #059669;
            color: #ffffff;
        }

        @media (max-width: 991.98px) {
            .pm-topbar {
                margin-left: 0 !important;
                width: 100% !important;
            }
        }

        @media (max-width: 767.98px) {
            .pm-topbar-actions {
                gap: 10px;
            }

            .pm-selling-btn {
                height: 36px;
                padding: 0 11px;
            }

            .pm-notification-toast-container {
                top: 70px;
                right: 16px;
                left: 16px;
                width: auto;
            }
        }
    </style>

    <script th:inline="none">
        (function () {
            var SUMMARY_URL =
                '/notifications/realtime/summary';

            var STREAM_URL =
                '/notifications/realtime/stream';

            /**
             * Chuyển giá trị null thành chuỗi rỗng.
             */
            function safeText(value) {
                return value == null
                    ? ''
                    : String(value);
            }

            var topbar =
                document.getElementById('topbar');

            var notificationBasePath = topbar
                ? safeText(
                    topbar.dataset.notificationsBase
                )
                : '';

            var csrfHeaderName = topbar
                ? safeText(topbar.dataset.csrfHeader)
                : '';

            var csrfToken = topbar
                ? safeText(topbar.dataset.csrfToken)
                : '';

            /*
             * Lưu ID những thông báo đã có khi trang
             * được tải để không popup lại thông báo cũ.
             */
            var knownNotificationIds = new Set();

            document
                .querySelectorAll(
                    '.realtime-notification-item'
                    + '[data-notification-id]'
                )
                .forEach(function (item) {
                    knownNotificationIds.add(
                        safeText(
                            item.dataset.notificationId
                        )
                    );
                });

            /**
             * Chỉ cho phép điều hướng tới URL nội bộ.
             */
            function internalUrl(value, fallback) {
                var url =
                    safeText(value).trim();

                return url.indexOf('/') === 0
                && url.indexOf('//') !== 0
                    ? url
                    : fallback;
            }

            function removeNotificationToast(toast) {
                if (!toast
                    || !toast.parentElement) {
                    return;
                }

                toast.classList.remove('show');

                window.setTimeout(function () {
                    if (toast.parentElement) {
                        toast.remove();
                    }
                }, 220);
            }

            /**
             * Đánh dấu thông báo đã đọc rồi chuyển tới
             * trang nghiệp vụ tương ứng.
             */
            function openNotificationAndNavigate(
                notificationId,
                actionUrl
            ) {
                var fallbackUrl = internalUrl(
                    actionUrl,
                    notificationBasePath || '/'
                );

                if (!notificationBasePath
                    || !notificationId) {

                    window.location.assign(fallbackUrl);
                    return;
                }

                var headers = {
                    'Accept': 'application/json'
                };

                if (csrfHeaderName && csrfToken) {
                    headers[csrfHeaderName] =
                        csrfToken;
                }

                fetch(
                    notificationBasePath
                    + '/'
                    + encodeURIComponent(
                        notificationId
                    )
                    + '/open',
                    {
                        method: 'POST',
                        headers: headers,
                        credentials: 'same-origin'
                    }
                )
                    .then(function (response) {
                        if (!response.ok) {
                            throw new Error(
                                'Không thể mở thông báo'
                            );
                        }

                        return response.json();
                    })
                    .then(function (result) {
                        /*
                         * Hỗ trợ cả hai kiểu response:
                         * NotificationResponse trực tiếp hoặc
                         * object có thuộc tính notification.
                         */
                        var openedNotification =
                            result
                            && result.notification
                                ? result.notification
                                : result;

                        var serverActionUrl =
                            openedNotification
                                ? openedNotification.actionUrl
                                : '';

                        window.location.assign(
                            internalUrl(
                                serverActionUrl,
                                fallbackUrl
                            )
                        );
                    })
                    .catch(function () {
                        /*
                         * Nếu request đánh dấu đã đọc gặp lỗi,
                         * vẫn cho phép người dùng tới trang đích.
                         */
                        window.location.assign(
                            fallbackUrl
                        );
                    });
            }

            /**
             * Hiển thị popup của một thông báo mới.
             */
            function showNotificationToast(
                notification
            ) {
                var container =
                    document.getElementById(
                        'notificationToastContainer'
                    );

                if (!container || !notification) {
                    return;
                }

                /*
                 * Chỉ giữ tối đa ba popup trên màn hình.
                 */
                while (container.children.length >= 3) {
                    container.firstElementChild.remove();
                }

                var toast =
                    document.createElement('div');

                toast.className =
                    'pm-notification-toast';

                toast.setAttribute(
                    'role',
                    'status'
                );

                var content =
                    document.createElement('div');

                content.className =
                    'pm-notification-toast-content';

                var icon =
                    document.createElement('span');

                icon.className =
                    'pm-notification-toast-icon';

                var iconGlyph =
                    document.createElement('i');

                iconGlyph.className =
                    'ti ti-bell';

                icon.appendChild(iconGlyph);

                var body =
                    document.createElement('div');

                body.className =
                    'pm-notification-toast-body';

                var title =
                    document.createElement('p');

                title.className =
                    'pm-notification-toast-title';

                title.textContent =
                    safeText(notification.title);

                var message =
                    document.createElement('p');

                message.className =
                    'pm-notification-toast-message';

                message.textContent =
                    safeText(notification.message);

                var actions =
                    document.createElement('div');

                actions.className =
                    'pm-notification-toast-actions';

                var openButton =
                    document.createElement('button');

                openButton.type = 'button';

                openButton.className =
                    'pm-notification-toast-open';

                openButton.textContent =
                    'Xem ngay';

                var closeButton =
                    document.createElement('button');

                closeButton.type = 'button';

                closeButton.className =
                    'pm-notification-toast-close';

                closeButton.setAttribute(
                    'aria-label',
                    'Đóng thông báo'
                );

                closeButton.textContent = '×';

                actions.appendChild(openButton);

                body.appendChild(title);
                body.appendChild(message);
                body.appendChild(actions);

                content.appendChild(icon);
                content.appendChild(body);

                toast.appendChild(content);
                toast.appendChild(closeButton);

                container.appendChild(toast);

                var openCurrentNotification =
                    function () {

                        openNotificationAndNavigate(
                            safeText(notification.id),
                            safeText(
                                notification.actionUrl
                            )
                        );
                    };

                openButton.addEventListener(
                    'click',
                    openCurrentNotification
                );

                closeButton.addEventListener(
                    'click',
                    function (event) {
                        event.stopPropagation();

                        removeNotificationToast(
                            toast
                        );
                    }
                );

                window.requestAnimationFrame(
                    function () {
                        toast.classList.add('show');
                    }
                );

                /*
                 * Popup tự đóng sau 8 giây.
                 */
                window.setTimeout(function () {
                    removeNotificationToast(toast);
                }, 8000);
            }

            /**
             * Lấy số lượng chưa đọc và danh sách
             * thông báo mới nhất.
             */
            function refreshNotificationTopbar(
                showPopup
            ) {
                fetch(
                    SUMMARY_URL,
                    {
                        headers: {
                            'Accept':
                                'application/json'
                        },
                        credentials: 'same-origin'
                    }
                )
                    .then(function (response) {
                        if (!response.ok) {
                            throw new Error(
                                'Không thể tải thông báo'
                            );
                        }

                        return response.json();
                    })
                    .then(function (data) {
                        renderNotificationTopbar(
                            data,
                            showPopup === true
                        );
                    })
                    .catch(function () {
                        /*
                         * Bỏ qua lỗi mạng tạm thời.
                         * SSE sẽ phát sự kiện lại khi
                         * có thay đổi tiếp theo.
                         */
                    });
            }

            /**
             * Cập nhật badge và dropdown thông báo.
             */
            function renderNotificationTopbar(
                data,
                showPopup
            ) {
                var count = Number(
                    data && data.unreadCount
                        ? data.unreadCount
                        : 0
                );

                var bell =
                    document.querySelector(
                        '[aria-label="Thông báo"]'
                    );

                var dot =
                    document.getElementById(
                        'notificationDot'
                    );

                var badge =
                    document.getElementById(
                        'notificationCountBadge'
                    );

                /*
                 * Cập nhật chấm đỏ và tổng số
                 * thông báo chưa đọc.
                 */
                if (count > 0) {
                    if (!dot && bell) {
                        dot =
                            document.createElement(
                                'span'
                            );

                        dot.id =
                            'notificationDot';

                        dot.className =
                            'pm-notification-dot';

                        dot.setAttribute(
                            'aria-hidden',
                            'true'
                        );

                        bell.appendChild(dot);
                    }

                    if (!badge) {
                        badge =
                            document.createElement(
                                'span'
                            );

                        badge.id =
                            'notificationCountBadge';

                        badge.className =
                            'badge bg-success';

                        var header =
                            document.querySelector(
                                '.pm-notification-header-link'
                            );

                        if (header) {
                            header.appendChild(badge);
                        }
                    }

                    if (badge) {
                        badge.textContent =
                            String(count);
                    }
                } else {
                    if (dot) {
                        dot.remove();
                    }

                    if (badge) {
                        badge.remove();
                    }
                }

                /*
                 * Xóa danh sách thông báo cũ khỏi
                 * dropdown trước khi render lại.
                 */
                document
                    .querySelectorAll(
                        '.realtime-notification-item'
                    )
                    .forEach(function (item) {
                        item.remove();
                    });

                var oldEmpty =
                    document.getElementById(
                        'notificationEmptyState'
                    );

                if (oldEmpty) {
                    oldEmpty.remove();
                }

                var viewAll =
                    document.getElementById(
                        'notificationViewAll'
                    );

                var list = viewAll
                    ? viewAll.parentElement
                    : null;

                var notifications =
                    data
                    && Array.isArray(
                        data.latestNotifications
                    )
                        ? data.latestNotifications
                        : [];

                /*
                 * Chỉ lấy những thông báo chưa từng
                 * xuất hiện và vẫn đang chưa đọc.
                 */
                var newNotifications =
                    notifications.filter(
                        function (notification) {
                            var id = notification
                                ? safeText(
                                    notification.id
                                )
                                : '';

                            return id
                                && !knownNotificationIds
                                    .has(id)
                                && !Boolean(
                                    notification.isRead
                                );
                        }
                    );

                /*
                 * Ghi nhận tất cả ID vừa nhận để lần
                 * tải sau không hiện lại popup cũ.
                 */
                notifications.forEach(
                    function (notification) {
                        if (notification
                            && notification.id != null) {

                            knownNotificationIds.add(
                                safeText(
                                    notification.id
                                )
                            );
                        }
                    }
                );

                if (showPopup) {
                    newNotifications
                        .slice(0, 3)
                        .forEach(
                            showNotificationToast
                        );
                }

                if (!list || !viewAll) {
                    return;
                }

                /*
                 * Trạng thái không có thông báo.
                 */
                if (notifications.length === 0) {
                    var empty =
                        document.createElement('li');

                    empty.id =
                        'notificationEmptyState';

                    empty.className =
                        'p-3 border-bottom';

                    var emptyText =
                        document.createElement('div');

                    emptyText.className =
                        'small text-secondary';

                    emptyText.textContent =
                        'Hiện chưa có thông báo.';

                    empty.appendChild(emptyText);

                    list.insertBefore(
                        empty,
                        viewAll
                    );

                    return;
                }

                /*
                 * Dùng textContent thay vì innerHTML
                 * để nội dung thông báo không bị đưa
                 * trực tiếp vào trang dưới dạng HTML.
                 */
                notifications.forEach(
                    function (notification) {
                        var item =
                            document.createElement(
                                'li'
                            );

                        item.className =
                            'p-3 border-bottom '
                            + 'realtime-notification-item '
                            + 'pm-notification-clickable';

                        item.setAttribute(
                            'role',
                            'button'
                        );

                        item.tabIndex = 0;

                        item.dataset.notificationId =
                            safeText(notification.id);

                        item.dataset.actionUrl =
                            safeText(
                                notification.actionUrl
                            );

                        var content =
                            document.createElement(
                                'div'
                            );

                        content.className = 'small';

                        var title =
                            document.createElement(
                                'p'
                            );

                        title.className =
                            'mb-1 fw-semibold';

                        title.textContent =
                            safeText(
                                notification.title
                            );

                        var message =
                            document.createElement(
                                'p'
                            );

                        message.className =
                            'mb-1 text-secondary';

                        message.textContent =
                            safeText(
                                notification.message
                            );

                        var createdAt =
                            document.createElement(
                                'span'
                            );

                        createdAt.className =
                            'text-secondary';

                        createdAt.textContent =
                            safeText(
                                notification
                                    .createdAtDisplay
                            );

                        content.appendChild(title);
                        content.appendChild(message);
                        content.appendChild(createdAt);

                        item.appendChild(content);

                        list.insertBefore(
                            item,
                            viewAll
                        );
                    }
                );
            }

            /*
             * Bấm vào một thông báo trong dropdown.
             */
            document.addEventListener(
                'click',
                function (event) {
                    var item =
                        event.target.closest(
                            '.realtime-notification-item'
                            + '[data-notification-id]'
                        );

                    if (!item) {
                        return;
                    }

                    event.preventDefault();

                    openNotificationAndNavigate(
                        item.dataset.notificationId,
                        item.dataset.actionUrl
                    );
                }
            );

            /*
             * Hỗ trợ mở thông báo bằng phím
             * Enter hoặc Space.
             */
            document.addEventListener(
                'keydown',
                function (event) {
                    if (event.key !== 'Enter'
                        && event.key !== ' ') {
                        return;
                    }

                    var item =
                        event.target.closest(
                            '.realtime-notification-item'
                            + '[data-notification-id]'
                        );

                    if (!item) {
                        return;
                    }

                    event.preventDefault();

                    openNotificationAndNavigate(
                        item.dataset.notificationId,
                        item.dataset.actionUrl
                    );
                }
            );

            /**
             * Mốc thao tác thật gần nhất của người dùng.
             *
             * Không sử dụng mousemove vì chuyển động chuột
             * nhỏ không nhất thiết là người dùng đang làm việc.
             */
            var IDLE_MS =
                5 * 60 * 1000;

            var lastActivityAt =
                Date.now();

            function isUserActive() {
                return document.visibilityState
                    === 'visible'
                    && (
                        Date.now() - lastActivityAt
                    ) <= IDLE_MS;
            }

            /**
             * Mở kết nối SSE nhận thông báo realtime.
             */
            var notificationStream = null;

            function openNotificationStream() {
                if (!window.EventSource
                    || notificationStream) {
                    return;
                }

                notificationStream =
                    new EventSource(STREAM_URL);

                notificationStream
                    .addEventListener(
                        'notification-refresh',
                        function () {
                            /*
                             * Khi server báo có thay đổi,
                             * tải lại topbar và cho phép
                             * hiển thị popup mới.
                             */
                            refreshNotificationTopbar(
                                true
                            );
                        }
                    );
            }

            function closeNotificationStream() {
                if (!notificationStream) {
                    return;
                }

                notificationStream.close();
                notificationStream = null;
            }

            openNotificationStream();

            window.addEventListener(
                'beforeunload',
                closeNotificationStream
            );

            /**
             * Khi người dùng quay lại sau một khoảng
             * nghỉ, mở lại SSE và tải bù thông báo.
             */
            function markUserActivity() {
                lastActivityAt = Date.now();

                if (document.visibilityState
                    === 'visible'
                    && !notificationStream) {

                    openNotificationStream();

                    refreshNotificationTopbar(
                        true
                    );
                }
            }

            [
                'pointerdown',
                'keydown',
                'scroll',
                'wheel',
                'touchstart'
            ].forEach(
                function (eventName) {
                    window.addEventListener(
                        eventName,
                        markUserActivity,
                        {
                            passive: true
                        }
                    );
                }
            );

            document.addEventListener(
                'visibilitychange',
                function () {
                    if (document.visibilityState
                        === 'visible') {

                        markUserActivity();
                    } else {
                        closeNotificationStream();
                    }
                }
            );

            /*
             * Kiểm tra trạng thái phiên đăng nhập.
             */
            var POLL_MS = 30000;

            setInterval(
                function () {
                    /*
                     * Chỉ gửi request kiểm tra phiên khi
                     * người dùng thực sự đang hoạt động.
                     *
                     * Nếu không còn hoạt động thì đóng SSE
                     * để request nền không giữ phiên sống
                     * mãi mãi.
                     */
                    if (!isUserActive()) {
                        closeNotificationStream();
                        return;
                    }

                    fetch(
                        '/api/session/check'
                    )
                        .then(function (response) {
                            /*
                             * Server có thể điều hướng tới:
                             *
                             * /signin?roleChanged
                             * khi vai trò hoặc quyền thay đổi.
                             *
                             * /signin
                             * khi phiên đăng nhập hết hạn.
                             */
                            if (response.redirected) {
                                window.location.replace(
                                    response.url
                                );
                            } else if (
                                response.status === 401
                                || response.status === 403
                            ) {
                                window.location.replace(
                                    '/signin'
                                );
                            }
                        })
                        .catch(function () {
                            /*
                             * Bỏ qua lỗi mạng tạm thời.
                             */
                        });
                },
                POLL_MS
            );
        })();
    </script>

</th:block>
