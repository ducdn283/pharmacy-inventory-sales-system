<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>
<!--
  Reusable money-input formatting: turns any <input data-money> into a thousand-separated field
  (500000 -> 500.000, dấu chấm theo chuẩn vi-VN, giống Kế hoạch mua hàng) while still POSTing a
  plain number the server can bind to a BigDecimal.

  Cách dùng:
      <input type="text" inputmode="numeric" data-money th:field="*{amount}">
      ...
      <div th:replace="~{fragments/money-input :: moneyInputs}"></div>   (đặt cuối <body>)

  Đọc giá trị số trong JS của trang: pmMoneyValue(document.getElementById('amountInput'))

  data-money-allow-negative — cho ô nhận số ÂM. Mặc định ô tiền chỉ nhận chữ số vì hầu hết ô tiền
  (chi, thu, giá nhập) không bao giờ âm. Khi bật, ô nhận một dấu trừ ở ĐẦU (gõ, dán, và cả giá trị
  âm do server render) và pmMoneyValue() trả số âm tương ứng.
-->
<th:block th:fragment="moneyInputs">
    <script>
        (function () {
            function allowsNegative(input) {
                return !!(input && input.hasAttribute && input.hasAttribute('data-money-allow-negative'));
            }

            /**
             * Chuỗi người dùng đang gõ, nơi dấu chấm là dấu phân cách: giữ lại chữ số, và giữ một dấu
             * trừ ở ĐẦU nếu ô cho phép số âm. Trả về "-" đơn lẻ khi người dùng mới gõ dấu trừ — chưa
             * phải số, nhưng phải để nguyên trong ô cho họ gõ tiếp.
             */
            function separatorDigits(input, value) {
                var raw = String(value == null ? '' : value);
                var negative = allowsNegative(input) && raw.trim().charAt(0) === '-';
                return (negative ? '-' : '') + raw.replace(/[^\d]/g, '');
            }

            /**
             * Digits của giá trị do server render. Ở đây dấu chấm là dấu thập phân của BigDecimal
             * ("500000.00"), không phải dấu phân cách — bóc thẳng ký tự sẽ ra "50000000".
             */
            function initialDigits(input, value) {
                var raw = String(value == null ? '' : value).trim();
                if (!raw) return '';
                var num = Number(raw.replace(/\s/g, ''));
                if (Number.isFinite(num)) {
                    if (num === 0) return '0';
                    // Số âm chỉ giữ được ở ô đã bật data-money-allow-negative; ô thường vẫn bỏ như cũ
                    // để một giá trị âm bất thường không âm thầm biến thành số dương.
                    if (num < 0) return allowsNegative(input) ? String(Math.round(num)) : '';
                    return String(Math.round(num));
                }
                return separatorDigits(input, raw);
            }

            function group(signedDigits) {
                if (!signedDigits || signedDigits === '-') return signedDigits || '';
                var negative = signedDigits.charAt(0) === '-';
                var digits = negative ? signedDigits.slice(1) : signedDigits;
                if (!digits) return negative ? '-' : '';
                return (negative ? '-' : '') + Number(digits).toLocaleString('vi-VN');
            }

            function reformat(input, digits) {
                var caretFromEnd = input.value.length - (input.selectionStart == null ? input.value.length : input.selectionStart);
                input.value = group(digits);
                if (document.activeElement === input) {
                    var pos = Math.max(0, input.value.length - caretFromEnd);
                    try { input.setSelectionRange(pos, pos); } catch (ignored) { /* not a text input yet */ }
                }
            }

            /** Numeric value of a money input, ignoring the separators. Âm nếu ô cho phép và đang âm. */
            window.pmMoneyValue = function (input) {
                var signed = separatorDigits(input, input && input.value);
                // "" hoặc "-" (mới gõ dấu trừ, chưa có số) đều chưa là một con số.
                if (!signed || signed === '-') return 0;
                return Number(signed);
            };

            function initInput(input) {
                // type=number refuses a value containing dots, so these must be plain text fields.
                input.setAttribute('type', 'text');
                input.setAttribute('inputmode', allowsNegative(input) ? 'text' : 'numeric');
                input.setAttribute('autocomplete', 'off');
                reformat(input, initialDigits(input, input.value));

                input.addEventListener('input', function () {
                    reformat(input, separatorDigits(input, input.value));
                });
                input.addEventListener('blur', function () {
                    reformat(input, separatorDigits(input, input.value));
                });
            }

            function initForm(form) {
                // Runs after the page's own submit listeners, so a validation handler that called
                // preventDefault() leaves the field formatted instead of flashing back to raw digits.
                form.addEventListener('submit', function (event) {
                    if (event.defaultPrevented) {
                        return;
                    }
                    form.querySelectorAll('input[data-money]').forEach(function (input) {
                        var signed = separatorDigits(input, input.value);
                        // Dấu trừ trơ trọi không phải số — gửi rỗng để @NotNull/required báo lỗi tử tế
                        // thay vì Spring nổ NumberFormatException khi bind BigDecimal.
                        input.value = signed === '-' ? '' : signed;
                    });
                });
            }

            function init() {
                document.querySelectorAll('input[data-money]').forEach(initInput);
                document.querySelectorAll('form').forEach(initForm);
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }
        })();
    </script>
</th:block>
</body>
</html>
