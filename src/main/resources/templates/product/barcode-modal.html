<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">

<body>

<th:block th:fragment="barcodeModal(basePath)">

    <style>
        .barcode-modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 1065;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: rgba(15, 23, 42, 0.58);
        }

        .barcode-modal-overlay.show {
            display: flex;
        }

        .barcode-modal-dialog {
            width: min(1060px, 100%);
            max-height: calc(100vh - 40px);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border-radius: 16px;
            background: #ffffff;
            box-shadow:
                    0 24px 70px
                    rgba(15, 23, 42, 0.28);
        }

        .barcode-modal-header,
        .barcode-modal-footer {
            padding: 16px 20px;
        }

        .barcode-modal-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 16px;
            border-bottom: 1px solid #e5e7eb;
        }

        .barcode-modal-body {
            overflow: auto;
            padding: 18px 20px;
        }

        .barcode-modal-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            border-top: 1px solid #e5e7eb;
            background: #ffffff;
        }

        .barcode-search-area {
            position: relative;
        }

        .barcode-search-results {
            position: absolute;
            z-index: 8;
            top: calc(100% + 4px);
            left: 0;
            right: 0;
            display: none;
            max-height: 310px;
            overflow: auto;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            background: #ffffff;
            box-shadow:
                    0 14px 32px
                    rgba(15, 23, 42, 0.16);
        }

        .barcode-search-results.show {
            display: block;
        }

        .barcode-result-item {
            width: 100%;
            padding: 11px 14px;
            border: 0;
            border-bottom: 1px solid #f1f5f9;
            background: #ffffff;
            text-align: left;
        }

        .barcode-result-item:hover:not(:disabled) {
            background: #ecfdf5;
        }

        .barcode-result-item:disabled {
            cursor: not-allowed;
            opacity: 0.6;
        }

        .barcode-result-item:last-child {
            border-bottom: 0;
        }

        .barcode-invoice-panel {
            display: none;
            margin-top: 14px;
            padding: 14px;
            border: 1px solid #dbeafe;
            border-radius: 12px;
            background: #f8fbff;
        }

        .barcode-invoice-panel.show {
            display: block;
        }

        .barcode-invoice-results {
            max-height: 260px;
            overflow: auto;
        }

        .barcode-invoice-item {
            display: grid;
            grid-template-columns:
                    1.1fr 0.8fr 1.2fr 0.8fr auto;
            align-items: center;
            gap: 10px;
            padding: 10px;
            border-bottom: 1px solid #e5e7eb;
        }

        .barcode-invoice-item:last-child {
            border-bottom: 0;
        }

        .barcode-selected-table th {
            font-size: 12px;
            color: #64748b;
            background: #f8fafc;
            white-space: nowrap;
        }

        .barcode-selected-table td {
            vertical-align: middle;
        }

        .barcode-quantity-input {
            width: 96px;
            margin-left: auto;
            text-align: right;
        }

        .barcode-empty-state {
            padding: 42px 16px;
            text-align: center;
            color: #64748b;
        }

        .barcode-total {
            font-size: 14px;
            color: #475569;
        }

        .barcode-total strong {
            font-size: 20px;
            color: #0f172a;
        }

        @media (max-width: 767.98px) {
            .barcode-modal-footer {
                align-items: stretch;
                flex-direction: column;
            }

            .barcode-modal-footer > div {
                width: 100%;
            }

            .barcode-invoice-item {
                grid-template-columns: 1fr;
            }

            .barcode-toolbar {
                flex-direction: column;
            }

            .barcode-toolbar > * {
                width: 100%;
            }
        }
    </style>

    <div id="barcodePrintModal"
         class="barcode-modal-overlay"
         role="dialog"
         aria-modal="true"
         aria-labelledby="barcodePrintModalTitle"
         aria-hidden="true"
         th:attr="data-base-path=${basePath}">

        <form id="barcodePrintForm"
              class="barcode-modal-dialog"
              method="post"
              target="_blank"
              th:action="${basePath + '/barcode/print'}">

            <input th:if="${_csrf != null}"
                   type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}">

            <div class="barcode-modal-header">
                <div>
                    <h2 id="barcodePrintModalTitle"
                        class="fs-5 mb-1">
                        In tem mã
                    </h2>

                    <p class="small text-secondary mb-0">
                        Tìm hàng hóa hoặc thêm toàn bộ
                        hàng từ hóa đơn nhập.
                    </p>
                </div>

                <button id="closeBarcodeModalBtn"
                        type="button"
                        class="btn-close"
                        aria-label="Đóng">
                </button>
            </div>

            <div class="barcode-modal-body">

                <div id="barcodeModalAlert"
                     class="alert d-none mb-3"
                     role="alert">
                </div>

                <div class="d-flex gap-2 barcode-toolbar">

                    <div class="barcode-search-area flex-grow-1">

                        <div class="input-group">
                            <span class="input-group-text bg-white">
                                <i class="ti ti-search"></i>
                            </span>

                            <input id="barcodeProductSearch"
                                   type="search"
                                   class="form-control"
                                   placeholder="Tìm theo mã, tên hàng hóa hoặc barcode..."
                                   autocomplete="off">
                        </div>

                        <div id="barcodeProductSearchResults"
                             class="barcode-search-results">
                        </div>
                    </div>

                    <button id="toggleInvoicePanelBtn"
                            type="button"
                            class="btn btn-outline-primary text-nowrap">
                        <i class="ti ti-file-invoice me-1"></i>
                        Thêm theo hóa đơn nhập
                    </button>
                </div>

                <div id="barcodeInvoicePanel"
                     class="barcode-invoice-panel">

                    <div class="d-flex justify-content-between
                                align-items-center gap-2 mb-3">

                        <div>
                            <div class="fw-semibold">
                                Chọn hóa đơn nhập
                            </div>

                            <div class="small text-secondary">
                                Số lượng tem mặc định bằng
                                số lượng đã nhập.
                            </div>
                        </div>

                        <button id="closeInvoicePanelBtn"
                                type="button"
                                class="btn-close"
                                aria-label="Đóng">
                        </button>
                    </div>

                    <div class="input-group mb-3">
                        <span class="input-group-text bg-white">
                            <i class="ti ti-search"></i>
                        </span>

                        <input id="barcodeInvoiceSearch"
                               type="search"
                               class="form-control"
                               placeholder="Tìm mã hóa đơn hoặc nhà cung cấp..."
                               autocomplete="off">
                    </div>

                    <div id="barcodeInvoiceResults"
                         class="barcode-invoice-results">

                        <div class="text-secondary small
                                    py-3 text-center">
                            Nhập từ khóa để tìm hóa đơn nhập.
                        </div>
                    </div>
                </div>

                <div class="table-responsive
                            mt-4 border rounded-3">

                    <table class="table
                                  barcode-selected-table
                                  align-middle mb-0">

                        <thead>
                        <tr>
                            <th style="width: 44px"></th>
                            <th>Mã hàng</th>
                            <th>Tên hàng</th>
                            <th>Đơn vị</th>
                            <th class="text-end">
                                Giá bán
                            </th>
                            <th class="text-end"
                                style="width: 120px">
                                Số lượng
                            </th>
                        </tr>
                        </thead>

                        <tbody id="barcodeSelectedRows">
                        </tbody>
                    </table>

                    <div id="barcodeEmptyState"
                         class="barcode-empty-state">

                        <i class="ti ti-barcode
                                  fs-1 d-block mb-2">
                        </i>

                        Chưa có hàng hóa nào
                        trong danh sách in.
                    </div>
                </div>
            </div>

            <div class="barcode-modal-footer">

                <div class="barcode-total">
                    Tổng số tem:
                    <strong id="barcodeTotalLabels">
                        0
                    </strong>

                    <div class="small text-secondary">
                        Khổ giấy A5 nằm ngang
                    </div>
                </div>

                <div class="d-flex gap-2 justify-content-end">

                    <button id="cancelBarcodeModalBtn"
                            type="button"
                            class="btn btn-outline-secondary">
                        Bỏ qua
                    </button>

                    <button id="submitBarcodePrintBtn"
                            type="submit"
                            class="btn btn-stock-primary"
                            disabled>

                        <i class="ti ti-printer me-1"></i>
                        In tem mã
                    </button>
                </div>
            </div>
        </form>
    </div>

    <script th:inline="none">
        (function () {
            const openButton =
                document.getElementById(
                    'openBarcodeModalBtn'
                );

            const modal =
                document.getElementById(
                    'barcodePrintModal'
                );

            if (!openButton || !modal) {
                return;
            }

            const basePath =
                modal.dataset.basePath;

            const form =
                document.getElementById(
                    'barcodePrintForm'
                );

            const productSearch =
                document.getElementById(
                    'barcodeProductSearch'
                );

            const productResults =
                document.getElementById(
                    'barcodeProductSearchResults'
                );

            const invoicePanel =
                document.getElementById(
                    'barcodeInvoicePanel'
                );

            const invoiceSearch =
                document.getElementById(
                    'barcodeInvoiceSearch'
                );

            const invoiceResults =
                document.getElementById(
                    'barcodeInvoiceResults'
                );

            const selectedRows =
                document.getElementById(
                    'barcodeSelectedRows'
                );

            const emptyState =
                document.getElementById(
                    'barcodeEmptyState'
                );

            const totalLabels =
                document.getElementById(
                    'barcodeTotalLabels'
                );

            const submitButton =
                document.getElementById(
                    'submitBarcodePrintBtn'
                );

            const alertBox =
                document.getElementById(
                    'barcodeModalAlert'
                );

            const selectedProducts = new Map();

            let productSearchTimer;
            let invoiceSearchTimer;

            function escapeHtml(value) {
                return String(value ?? '')
                    .replace(
                        /[&<>'"]/g,
                        function (character) {
                            const replacements = {
                                '&': '&amp;',
                                '<': '&lt;',
                                '>': '&gt;',
                                "'": '&#39;',
                                '"': '&quot;'
                            };

                            return replacements[character];
                        }
                    );
            }

            function formatMoney(value) {
                if (value == null) {
                    return '—';
                }

                return new Intl.NumberFormat(
                    'vi-VN'
                ).format(value) + ' ₫';
            }

            function showMessage(
                text,
                type = 'danger'
            ) {
                alertBox.className =
                    'alert alert-' + type + ' mb-3';

                alertBox.textContent = text;
            }

            function clearMessage() {
                alertBox.className =
                    'alert d-none mb-3';

                alertBox.textContent = '';
            }

            async function getJson(url) {
                const response = await fetch(
                    url,
                    {
                        headers: {
                            Accept: 'application/json'
                        }
                    }
                );

                const data = await response
                    .json()
                    .catch(function () {
                        return {};
                    });

                if (!response.ok) {
                    throw new Error(
                        data.message
                        || 'Không thể tải dữ liệu.'
                    );
                }

                return data;
            }

            function renderSelectedProducts() {
                selectedRows.innerHTML = '';

                let total = 0;

                selectedProducts.forEach(
                    function (item) {
                        total += item.quantity;

                        const row =
                            document.createElement('tr');

                        row.innerHTML = `
                            <td>
                                <button
                                    type="button"
                                    class="btn btn-sm
                                           btn-outline-danger
                                           remove-barcode-item"
                                    data-id="${item.productId}"
                                    title="Xóa">
                                    <i class="ti ti-trash"></i>
                                </button>
                            </td>

                            <td class="fw-semibold text-success">
                                ${escapeHtml(item.code || '—')}

                                <input
                                    type="hidden"
                                    name="productIds"
                                    value="${item.productId}">
                            </td>

                            <td>
                                <div class="fw-semibold">
                                    ${escapeHtml(item.name)}
                                </div>

                                <div class="${
                            item.barcode
                                ? 'small text-secondary'
                                : 'small text-danger'
                        }">
                                    ${
                            item.barcode
                                ? 'Barcode: '
                                + escapeHtml(item.barcode)
                                : 'Chưa có barcode'
                        }
                                </div>
                            </td>

                            <td>
                                ${escapeHtml(
                            item.unitName || '—'
                        )}
                            </td>

                            <td class="text-end">
                                ${formatMoney(item.sellPrice)}
                            </td>

                            <td class="text-end">
                                <input
                                    class="form-control
                                           form-control-sm
                                           barcode-quantity-input"
                                    type="number"
                                    name="quantities"
                                    min="1"
                                    max="1000"
                                    value="${item.quantity}"
                                    data-id="${item.productId}"
                                    aria-label="Số lượng tem">
                            </td>
                        `;

                        selectedRows.appendChild(row);
                    }
                );

                emptyState.style.display =
                    selectedProducts.size
                        ? 'none'
                        : '';

                totalLabels.textContent = total;

                const hasMissingBarcode =
                    Array.from(
                        selectedProducts.values()
                    ).some(function (item) {
                        return !item.barcode;
                    });

                submitButton.disabled =
                    !selectedProducts.size
                    || total < 1
                    || total > 5000
                    || hasMissingBarcode;
            }

            function addProduct(item) {
                const productId =
                    Number(item.productId);

                const quantity =
                    Math.max(
                        1,
                        Number(item.quantity) || 1
                    );

                if (!productId) {
                    return;
                }

                if (!item.barcode) {
                    showMessage(
                        'Sản phẩm "'
                        + item.name
                        + '" chưa có barcode nên '
                        + 'chưa thể thêm vào danh sách in.'
                    );

                    return;
                }

                const existingItem =
                    selectedProducts.get(productId);

                if (existingItem) {
                    existingItem.quantity = Math.min(
                        1000,
                        existingItem.quantity + quantity
                    );
                } else {
                    selectedProducts.set(
                        productId,
                        {
                            ...item,
                            productId: productId,
                            quantity: Math.min(
                                1000,
                                quantity
                            )
                        }
                    );
                }

                clearMessage();
                renderSelectedProducts();
            }

            async function searchProducts() {
                const keyword =
                    productSearch.value.trim();

                if (!keyword) {
                    productResults.classList.remove(
                        'show'
                    );

                    productResults.innerHTML = '';
                    return;
                }

                productResults.classList.add('show');

                productResults.innerHTML =
                    '<div class="p-3 '
                    + 'text-secondary small">'
                    + 'Đang tìm...</div>';

                try {
                    const url =
                        basePath
                        + '/barcode/search-products'
                        + '?keyword='
                        + encodeURIComponent(keyword);

                    const products =
                        await getJson(url);

                    if (!products.length) {
                        productResults.innerHTML =
                            '<div class="p-3 '
                            + 'text-secondary small">'
                            + 'Không tìm thấy sản phẩm '
                            + 'phù hợp.</div>';

                        return;
                    }

                    productResults.innerHTML =
                        products.map(
                            function (item, index) {
                                const disabled =
                                    item.barcode
                                        ? ''
                                        : 'disabled';

                                const barcodeDisplay =
                                    item.barcode
                                        ? 'Barcode: '
                                        + escapeHtml(
                                            item.barcode
                                        )
                                        : 'Chưa có barcode';

                                const barcodeClass =
                                    item.barcode
                                        ? 'text-secondary'
                                        : 'text-danger';

                                return `
                                    <button
                                        type="button"
                                        class="barcode-result-item"
                                        data-index="${index}"
                                        ${disabled}>

                                        <div class="d-flex
                                                    justify-content-between
                                                    gap-3">

                                            <div>
                                                <div class="fw-semibold">
                                                    ${
                                    escapeHtml(
                                        item.code || '—'
                                    )
                                }
                                                    —
                                                    ${
                                    escapeHtml(
                                        item.name
                                    )
                                }
                                                </div>

                                                <div class="small
                                                            ${barcodeClass}">
                                                    ${barcodeDisplay}
                                                </div>
                                            </div>

                                            <div class="small
                                                        text-end
                                                        text-nowrap">
                                                ${
                                    escapeHtml(
                                        item.unitName || '—'
                                    )
                                }
                                                <br>
                                                ${
                                    formatMoney(
                                        item.sellPrice
                                    )
                                }
                                            </div>
                                        </div>
                                    </button>
                                `;
                            }
                        ).join('');

                    productResults
                        .querySelectorAll('[data-index]')
                        .forEach(function (button) {
                            button.addEventListener(
                                'click',
                                function () {
                                    const index =
                                        Number(
                                            button.dataset.index
                                        );

                                    addProduct(
                                        products[index]
                                    );

                                    productSearch.value = '';

                                    productResults
                                        .classList
                                        .remove('show');

                                    productSearch.focus();
                                }
                            );
                        });
                } catch (exception) {
                    productResults.innerHTML =
                        '<div class="p-3 '
                        + 'text-danger small">'
                        + escapeHtml(exception.message)
                        + '</div>';
                }
            }

            async function searchInvoices() {
                const keyword =
                    invoiceSearch.value.trim();

                invoiceResults.innerHTML =
                    '<div class="text-secondary '
                    + 'small py-3 text-center">'
                    + 'Đang tìm...</div>';

                try {
                    const url =
                        basePath
                        + '/barcode/'
                        + 'search-purchase-invoices'
                        + '?keyword='
                        + encodeURIComponent(keyword);

                    const invoices =
                        await getJson(url);

                    if (!invoices.length) {
                        invoiceResults.innerHTML =
                            '<div class="text-secondary '
                            + 'small py-3 text-center">'
                            + 'Không tìm thấy hóa đơn '
                            + 'nhập phù hợp.</div>';

                        return;
                    }

                    invoiceResults.innerHTML =
                        invoices.map(
                            function (item, index) {
                                return `
                                    <div class="barcode-invoice-item">
                                        <strong>
                                            ${
                                    escapeHtml(
                                        item.purchaseInvoiceCode
                                    )
                                }
                                        </strong>

                                        <span>
                                            ${
                                    escapeHtml(
                                        item.dateDisplay || '—'
                                    )
                                }
                                        </span>

                                        <span>
                                            ${
                                    escapeHtml(
                                        item.supplierName || '—'
                                    )
                                }
                                        </span>

                                        <span>
                                            ${
                                    escapeHtml(
                                        item.status || '—'
                                    )
                                }
                                        </span>

                                        <button
                                            type="button"
                                            class="btn btn-sm
                                                   btn-outline-primary"
                                            data-invoice-index="${index}">
                                            Thêm
                                        </button>
                                    </div>
                                `;
                            }
                        ).join('');

                    invoiceResults
                        .querySelectorAll(
                            '[data-invoice-index]'
                        )
                        .forEach(function (button) {
                            button.addEventListener(
                                'click',
                                function () {
                                    const index =
                                        Number(
                                            button.dataset
                                                .invoiceIndex
                                        );

                                    addPurchaseInvoice(
                                        invoices[index]
                                            .purchaseId
                                    );
                                }
                            );
                        });
                } catch (exception) {
                    invoiceResults.innerHTML =
                        '<div class="text-danger '
                        + 'small py-3 text-center">'
                        + escapeHtml(exception.message)
                        + '</div>';
                }
            }

            async function addPurchaseInvoice(
                purchaseId
            ) {
                clearMessage();

                try {
                    const url =
                        basePath
                        + '/barcode/purchase-invoices/'
                        + purchaseId
                        + '/products';

                    const products =
                        await getJson(url);

                    const skippedProducts = [];

                    products.forEach(function (item) {
                        if (item.barcode) {
                            addProduct(item);
                        } else {
                            skippedProducts.push(
                                item.name
                            );
                        }
                    });

                    invoicePanel.classList.remove(
                        'show'
                    );

                    if (skippedProducts.length) {
                        showMessage(
                            'Đã bỏ qua sản phẩm chưa có '
                            + 'barcode: '
                            + skippedProducts.join(', '),
                            'warning'
                        );
                    } else {
                        showMessage(
                            'Đã thêm sản phẩm từ '
                            + 'hóa đơn nhập.',
                            'success'
                        );
                    }
                } catch (exception) {
                    showMessage(exception.message);
                }
            }

            function openModal() {
                modal.classList.add('show');

                modal.setAttribute(
                    'aria-hidden',
                    'false'
                );

                document.body.style.overflow =
                    'hidden';

                productSearch.focus();
            }

            function closeModal() {
                modal.classList.remove('show');

                modal.setAttribute(
                    'aria-hidden',
                    'true'
                );

                document.body.style.overflow = '';

                productResults.classList.remove(
                    'show'
                );

                invoicePanel.classList.remove(
                    'show'
                );

                openButton.focus();
            }

            openButton.addEventListener(
                'click',
                openModal
            );

            document
                .getElementById(
                    'closeBarcodeModalBtn'
                )
                .addEventListener(
                    'click',
                    closeModal
                );

            document
                .getElementById(
                    'cancelBarcodeModalBtn'
                )
                .addEventListener(
                    'click',
                    closeModal
                );

            modal.addEventListener(
                'click',
                function (event) {
                    if (event.target === modal) {
                        closeModal();
                    }
                }
            );

            document
                .getElementById(
                    'toggleInvoicePanelBtn'
                )
                .addEventListener(
                    'click',
                    function () {
                        invoicePanel.classList.toggle(
                            'show'
                        );

                        if (
                            invoicePanel.classList
                                .contains('show')
                        ) {
                            invoiceSearch.focus();
                            searchInvoices();
                        }
                    }
                );

            document
                .getElementById(
                    'closeInvoicePanelBtn'
                )
                .addEventListener(
                    'click',
                    function () {
                        invoicePanel.classList.remove(
                            'show'
                        );
                    }
                );

            productSearch.addEventListener(
                'input',
                function () {
                    clearTimeout(
                        productSearchTimer
                    );

                    productSearchTimer = setTimeout(
                        searchProducts,
                        300
                    );
                }
            );

            invoiceSearch.addEventListener(
                'input',
                function () {
                    clearTimeout(
                        invoiceSearchTimer
                    );

                    invoiceSearchTimer = setTimeout(
                        searchInvoices,
                        300
                    );
                }
            );

            selectedRows.addEventListener(
                'click',
                function (event) {
                    const removeButton =
                        event.target.closest(
                            '.remove-barcode-item'
                        );

                    if (!removeButton) {
                        return;
                    }

                    selectedProducts.delete(
                        Number(
                            removeButton.dataset.id
                        )
                    );

                    renderSelectedProducts();
                }
            );

            selectedRows.addEventListener(
                'change',
                function (event) {
                    if (
                        !event.target.classList
                            .contains(
                                'barcode-quantity-input'
                            )
                    ) {
                        return;
                    }

                    const productId =
                        Number(
                            event.target.dataset.id
                        );

                    const item =
                        selectedProducts.get(productId);

                    if (!item) {
                        return;
                    }

                    item.quantity = Math.max(
                        1,
                        Math.min(
                            1000,
                            Number(event.target.value) || 1
                        )
                    );

                    renderSelectedProducts();
                }
            );

            document.addEventListener(
                'click',
                function (event) {
                    if (
                        !event.target.closest(
                            '.barcode-search-area'
                        )
                    ) {
                        productResults.classList.remove(
                            'show'
                        );
                    }
                }
            );

            document.addEventListener(
                'keydown',
                function (event) {
                    if (
                        event.key === 'Escape'
                        && modal.classList.contains(
                            'show'
                        )
                    ) {
                        closeModal();
                    }
                }
            );

            form.addEventListener(
                'submit',
                function (event) {
                    const total =
                        Array.from(
                            selectedProducts.values()
                        ).reduce(
                            function (sum, item) {
                                return sum
                                    + item.quantity;
                            },
                            0
                        );

                    if (
                        !selectedProducts.size
                        || total < 1
                        || total > 5000
                    ) {
                        event.preventDefault();

                        showMessage(
                            'Danh sách in phải có từ '
                            + '1 đến 5.000 tem.'
                        );

                        return;
                    }

                    /*
                     * Form mở trang in trong tab mới.
                     * Modal đóng sau khi gửi form.
                     */
                    setTimeout(
                        closeModal,
                        250
                    );
                }
            );

            renderSelectedProducts();
        })();
    </script>

</th:block>

</body>
</html>
